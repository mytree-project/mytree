name: mytree

x-app-build: &app-build
  context: .
  dockerfile: docker/php/Dockerfile
  args:
    APP_UID: ${HOST_UID:-1000}
    APP_GID: ${HOST_GID:-1000}

x-app-volumes: &app-volumes
  - .:/var/www/html

services:
  app:
    build: *app-build
    working_dir: /var/www/html
    volumes: *app-volumes
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SCRIPT_NAME=/up
          SCRIPT_FILENAME=/var/www/html/public/index.php
          REQUEST_METHOD=GET
          REQUEST_URI=/up
          HTTP_HOST=localhost
          cgi-fcgi -bind -connect 127.0.0.1:9000 >/dev/null 2>&1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/nginx-health | grep -q '^ok$'"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mytree}
      POSTGRES_USER: ${DB_USERNAME:-mytree}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mytree_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: *app-build
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=90"]
    volumes: *app-volumes
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build: *app-build
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    volumes: *app-volumes
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
