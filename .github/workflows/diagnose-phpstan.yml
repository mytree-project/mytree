name: Diagnose PHPStan

on:
  push:
    branches:
      - feature/14-quality-gates
    paths:
      - .github/workflows/diagnose-phpstan.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Prepare local environment
        run: cp .env.example .env

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Capture PHPStan diagnostics
        shell: bash
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=raw > phpstan-result.txt 2>&1 || true

      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phpstan-result.txt
          git commit -m 'chore: capture PHPStan diagnostics'
          git push
