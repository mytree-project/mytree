name: Issue 41 QA transfer

on:
  push:
    branches:
      - tooling/41-qa-transfer-20260907

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout issue branch source
        uses: actions/checkout@v4
        with:
          ref: feature/41-claim-source-locator
          path: source
          fetch-depth: 0

      - name: Download published QA bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p transfer
          curl --fail --location --retry 3 \
            https://github.com/mytree-project/mytree/releases/download/ai-qa-bundle-latest/mytree-ai-qa-bundle.tar.gz \
            --output transfer/mytree-ai-qa-bundle.tar.gz
          curl --fail --location --retry 3 \
            https://github.com/mytree-project/mytree/releases/download/ai-qa-bundle-latest/mytree-ai-qa-bundle-manifest.json \
            --output transfer/mytree-ai-qa-bundle-manifest.json
          curl --fail --location --retry 3 \
            https://github.com/mytree-project/mytree/releases/download/ai-qa-bundle-latest/mytree-ai-qa-bundle.tar.gz.sha256 \
            --output transfer/mytree-ai-qa-bundle.tar.gz.sha256
          git -C source archive --format=tar.gz --output=../transfer/mytree-issue-41-source.tar.gz HEAD
          git -C source rev-parse HEAD > transfer/source-head.txt

      - name: Upload transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: issue-41-qa-transfer
          path: transfer/
          compression-level: 0
          retention-days: 1

