name: Bootstrap Pest browser dependencies

on:
  push:
    branches:
      - fix/141-source-workspace-save-errors

permissions:
  contents: write

jobs:
  update-locks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Add Pest 4 browser dependencies
        run: |
          composer remove phpunit/phpunit --dev --no-update --no-interaction
          composer config allow-plugins.pestphp/pest-plugin true
          composer require pestphp/pest:^4.0 pestphp/pest-plugin-browser:^4.0 --dev --with-all-dependencies --no-interaction

      - name: Add Playwright dependency
        run: |
          if [ ! -f package.json ]; then
            printf '%s\n' '{"name":"mytree-browser-tests","private":true}' > package.json
          fi
          npm install --save-dev playwright@latest

      - name: Commit generated lock files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.json composer.lock package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add locked Pest 4 browser test dependencies'
          git push
