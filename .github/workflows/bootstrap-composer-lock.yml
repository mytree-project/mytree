name: Bootstrap Composer lock

on:
  push:
    branches:
      - feature/issue-12-application-foundation
    paths:
      - composer.json
      - .github/workflows/bootstrap-composer-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Resolve dependencies
        run: composer update --no-interaction --no-progress --no-scripts --prefer-dist

      - name: Validate application baseline
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan package:discover --ansi
          php artisan test

      - name: Commit lock file
        shell: bash
        run: |
          if git diff --quiet -- composer.lock && git ls-files --error-unmatch composer.lock >/dev/null 2>&1; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "chore: lock application dependencies"
          git push
