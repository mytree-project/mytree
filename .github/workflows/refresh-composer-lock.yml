name: Refresh Composer lock

on:
  push:
    branches:
      - feature/14-quality-gates
    paths:
      - composer.json
      - .github/workflows/refresh-composer-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Refresh Larastan lock entries
        run: composer update larastan/larastan --with-dependencies --no-interaction --no-progress

      - name: Commit updated lock file
        shell: bash
        run: |
          if git diff --quiet -- composer.lock; then
            echo 'composer.lock is already up to date.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git commit -m 'build: refresh Composer lock for Larastan'
          git push
