name: Bootstrap Docker validation

on:
  push:
    branches:
      - feature/issue-12-application-foundation

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare local environment
        shell: bash
        run: |
          cp .env.example .env
          printf '\nHOST_UID=%s\nHOST_GID=%s\n' "$(id -u)" "$(id -g)" >> .env

      - name: Validate Compose model
        run: docker compose config >/dev/null

      - name: Build application image
        run: docker compose build

      - name: Install locked PHP dependencies
        run: docker compose run --rm --user "$(id -u):$(id -g)" app composer install --no-interaction --no-progress --prefer-dist

      - name: Generate application key
        run: docker compose run --rm --user "$(id -u):$(id -g)" app php artisan key:generate --ansi

      - name: Start infrastructure and migrate
        shell: bash
        run: |
          docker compose up -d postgres redis
          docker compose run --rm --user "$(id -u):$(id -g)" app php artisan migrate --force

      - name: Start application stack
        run: docker compose up -d

      - name: Verify live services and HTTP
        shell: bash
        run: |
          status=""

          for attempt in $(seq 1 60); do
            status="$(curl -sS -o /tmp/admin.body -D /tmp/admin.headers -w '%{http_code}' http://127.0.0.1:8080/admin || true)"
            echo "Attempt ${attempt}: /admin => HTTP ${status:-no-response}"

            if [[ "$status" =~ ^(200|301|302|303|307|308)$ ]]; then
              break
            fi

            sleep 2
          done

          if [[ ! "$status" =~ ^(200|301|302|303|307|308)$ ]]; then
            echo "The /admin endpoint did not become ready."
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:8080/up >/dev/null

          for service in app nginx postgres redis; do
            container_id="$(docker compose ps -q "$service")"
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            test "$health" = healthy
          done

          for service in worker scheduler; do
            container_id="$(docker compose ps -q "$service")"
            state="$(docker inspect --format '{{.State.Status}}' "$container_id")"
            test "$state" = running
          done

      - name: Verify bind-mount ownership
        shell: bash
        run: |
          host_uid="$(id -u)"
          test "$(stat -c '%u' vendor)" = "$host_uid"

          root_owned="$(find vendor storage bootstrap/cache -xdev -uid 0 -print -quit)"
          if [ -n "$root_owned" ]; then
            echo "Unexpected root-owned bind-mounted path: $root_owned"
            exit 1
          fi

      - name: Verify Nginx cannot access application environment
        shell: bash
        run: |
          if docker compose exec -T nginx test -e /var/www/html/.env; then
            echo "Nginx must not have access to /var/www/html/.env"
            exit 1
          fi

      - name: Verify Nginx survives application container IP change
        shell: bash
        run: |
          nginx_id="$(docker compose ps -q nginx)"
          app_id="$(docker compose ps -q app)"
          old_ip="$(docker inspect --format '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$app_id")"

          docker compose stop app
          docker compose rm -f app

          filler_id="$(docker run -d --network mytree_default alpine:3.22 sleep 120)"
          trap 'docker rm -f "$filler_id" >/dev/null 2>&1 || true' EXIT

          docker compose up -d app

          for attempt in $(seq 1 60); do
            app_id="$(docker compose ps -q app)"
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$app_id")"
            if [ "$health" = healthy ]; then
              break
            fi

            if [ "$attempt" -eq 60 ]; then
              echo "Recreated application container did not become healthy."
              exit 1
            fi

            sleep 2
          done

          new_ip="$(docker inspect --format '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$app_id")"
          echo "app IP before recreation: $old_ip"
          echo "app IP after recreation:  $new_ip"
          test "$new_ip" != "$old_ip"
          test "$(docker compose ps -q nginx)" = "$nginx_id"

          recovered=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/admin >/dev/null; then
              recovered=true
              break
            fi
            sleep 1
          done

          if [ "$recovered" != true ]; then
            echo "Nginx did not recover after the application container IP changed."
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:8080/up >/dev/null

          docker rm -f "$filler_id" >/dev/null
          trap - EXIT

      - name: Failure logs
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail=100 app nginx worker scheduler || true

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
